<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phish @ Sphere – Countdown</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: #00ff00;
      font-family: "Comic Sans MS", "Courier New", monospace;
      text-align: center;
      overflow: hidden;
    }

    marquee {
      font-size: 18px;
      color: #ff00ff;
    }

    h1 {
      font-size: 42px;
      margin-top: 40px;
      text-shadow: 2px 2px #ff00ff;
    }

    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 30px;
      font-size: 24px;
    }

    .box {
      border: 3px dashed #00ffff;
      padding: 10px 14px;
      background: rgba(255,255,255,0.1);
      min-width: 90px;
    }

    .label {
      font-size: 12px;
      margin-top: 6px;
      color: #ffff00;
    }

    #status {
      margin-top: 24px;
      font-size: 20px;
      color: #ff6600;
    }

    #logo {
      position: absolute;
      width: 160px;
      pointer-events: none;
    }

    .counter {
      margin-top: 18px;
      font-size: 14px;
      color: #ffffff;
    }

    .footer {
      position: fixed;
      bottom: 6px;
      width: 100%;
      font-size: 12px;
      color: #ffffff;
    }

    #enter {
      position: fixed;
      inset: 0;
      background: black;
      color: #00ff00;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-size: 24px;
      z-index: 9999;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- CLICK TO ENTER OVERLAY -->
  <div id="enter">
    <div class="blink">CLICK TO ENTER</div>
    <div style="font-size:14px;margin-top:12px;">(MIDI ENABLED)</div>
  </div>

  <marquee behavior="alternate" scrollamount="8">
    WELCOME TO THE PHISH INTERNET • MIDI ENABLED • PLEASE WAIT WHILE THE PAGE LOADS
  </marquee>

  <h1 class="blink">PHISH @ THE SPHERE</h1>
  <div>Las Vegas • May 2, 2026 • 8:00 PM PST</div>

  <div class="countdown">
    <div class="box"><div id="days">0</div><div class="label">DAYS</div></div>
    <div class="box"><div id="hours">0</div><div class="label">HOURS</div></div>
    <div class="box"><div id="minutes">0</div><div class="label">MINUTES</div></div>
    <div class="box"><div id="seconds">0</div><div class="label">SECONDS</div></div>
  </div>

  <div id="status"></div>
  <div class="counter">Visitor Count: <span id="visits">000001</span></div>

  <img id="logo" src="logo.png" alt="Phish Logo" />

  <!-- MIDI -->
  <audio id="midi" src="phish.mid" loop></audio>

  <div class="footer">
    Best viewed at 800x600 • MIDI ON • Netscape Navigator Approved • ⭕⭕⭕
  </div>
